# ══════════════════════════════════════════════════════════════════
# Benefícios API — site do Nginx do HOST (versionado no repositório)
#
# Instalação:
#   1. Copie para /etc/nginx/sites-available/beneficios-api.conf (ou conf.d/)
#      e ative com o link em sites-enabled/.
#   2. Troque `api.exemplo.com.br` pelo domínio real (2 lugares).
#   3. Descomente e ajuste `ssl_certificate` / `ssl_certificate_key`.
#      Enquanto estiverem comentados o `nginx -t` falha — é proposital.
#   4. nginx -t && systemctl reload nginx
#
# Este arquivo é incluído DENTRO do bloco `http {}` do nginx.conf, por isso
# as diretivas de zona, upstream e log_format ficam no topo, fora de `server`.
# Os nomes (beneficios_*) precisam ser únicos na máquina: se outro deploy
# (outra empresa) dividir o mesmo Nginx, renomeie zonas e upstream na cópia.
#
# Requer Nginx >= 1.11.8 ($request_id, log_format escape=json).
# ══════════════════════════════════════════════════════════════════

# ── Limite de requisições por IP (borda grossa) ──────────────────
# É só o primeiro freio, contra rajada e varredura. O limite fino (por
# usuário, CPF, chassi) é da aplicação — por IP não dá para ser justo:
# operadoras móveis colocam muitos aparelhos atrás do mesmo endereço (CGNAT).
# Se houver CDN/balanceador à frente, configure o módulo realip antes; sem
# isso `$binary_remote_addr` é o IP do CDN e todo mundo divide o mesmo balde.
#
# Chave vazia = requisição não contada. O webhook da M7 fica de fora: chega
# de poucos IPs do vendor, em rajada (eventos da frota inteira), e um 429 ali
# é evento perdido. A rota é autenticada por assinatura (x-m7-signature), só
# enfileira e também é isenta do limite da aplicação.
map $uri $beneficios_chave_ip {
    default                        $binary_remote_addr;
    /api/rastreamento/webhook-m7   "";
}

limit_req_zone $beneficios_chave_ip zone=beneficios_geral:20m rate=20r/s;
limit_req_zone $binary_remote_addr  zone=beneficios_auth:10m  rate=5r/s;

# ── Réplicas da API (docker-compose.escala.yml: api-1 e api-2, só em loopback) ──
# No deploy padrão (docker-compose.yml, um container `api` na 3001) deixe só a
# linha da 3001: a 3002 não existe e cada requisição perderia uma tentativa nela.
upstream beneficios_api {
    # Verificação passiva: 3 falhas em 10 s tiram a réplica do rodízio por 10 s.
    # É o que sustenta o deploy rolling: com uma réplica reiniciando, a
    # conexão recusada vai para a outra (ver proxy_next_upstream abaixo).
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;

    # Conexões ociosas reaproveitadas por worker do Nginx (evita um handshake
    # TCP por requisição). Exige HTTP/1.1 e `Connection ""` no proxy.
    keepalive 32;
}

# ── Log de acesso em JSON, com o mesmo request_id que vai para a API ─────
# Com ele dá para seguir uma requisição do Nginx até a linha de log da
# aplicação (LOG_FORMAT=json) e ver qual réplica atendeu e em quanto tempo.
log_format beneficios_json escape=json
    '{"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';

# ── HTTP: só redireciona para HTTPS ──────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.exemplo.com.br;

    # Desafio HTTP-01 do Let's Encrypt, se o certificado for emitido por webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────
server {
    # No Nginx >= 1.25.1 o `http2` do listen está obsoleto (só gera aviso):
    # troque por `listen 443 ssl;` + `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.exemplo.com.br;

    # PREENCHER — caminhos do certificado (exemplo com Let's Encrypt/certbot):
    # ssl_certificate     /etc/letsencrypt/live/api.exemplo.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.exemplo.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:beneficios_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Opcional, depois de confirmar que todo cliente usa HTTPS (é difícil voltar
    # atrás; e como `add_header` em um nível substitui os herdados, teria de ser
    # repetido em qualquer location que ganhasse add_header próprio):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;
    access_log /var/log/nginx/beneficios-api.access.log beneficios_json;
    error_log  /var/log/nginx/beneficios-api.error.log warn;

    # ── Corpo da requisição ──────────────────────────────────────
    # 1 MB por padrão — o mesmo teto da aplicação (BODY_LIMIT_PADRAO). Só as
    # rotas de upload, mais abaixo, sobem para 25 MB (a aplicação aceita 20 MB
    # nas fotos em base64 da revistoria; a folga cobre o envelope multipart).
    client_max_body_size 1m;

    # ── Limite por IP ────────────────────────────────────────────
    # 20 req/s com rajada de 60 atendida na hora (nodelay); o excedente
    # recebe 429 em vez de fila — fila só esconderia o problema como latência.
    limit_req_status 429;
    limit_req zone=beneficios_geral burst=60 nodelay;

    # ── Identificador de requisição ──────────────────────────────
    # Gerado aqui, enviado à API e devolvido ao cliente. O da resposta da API
    # é ocultado para o cliente não receber o header duplicado.
    add_header X-Request-Id $request_id always;
    proxy_set_header X-Request-Id $request_id;
    proxy_hide_header X-Request-Id;

    # ── Cabeçalhos para a API ────────────────────────────────────
    # A API roda com TRUST_PROXY=1: confia no ÚLTIMO endereço do
    # X-Forwarded-For, que é o que este Nginx acrescenta ($remote_addr).
    # O que o cliente mandar no header fica à esquerda e é ignorado.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keepalive com o upstream.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ── Tempos ───────────────────────────────────────────────────
    proxy_connect_timeout 5s;
    proxy_read_timeout    75s;
    proxy_send_timeout    75s;

    # ── Reenvio para a outra réplica ─────────────────────────────
    # Só o que não chegou a ser processado ou é seguro repetir:
    #  - conexão recusada/caída ANTES de enviar a requisição: reenvia qualquer
    #    método (nada foi entregue) — é o caso da réplica reiniciando no deploy;
    #  - depois de enviada: só métodos idempotentes. POST e PATCH NÃO são
    #    reenviados porque `non_idempotent` não está na lista — não acrescente.
    # No máximo uma segunda tentativa, e só se a falha vier em até 10 s: uma
    # leitura que estourou 75 s não é repetida na outra réplica (dobraria a
    # carga justamente quando a API está lenta).
    #
    # http_502 e http_503 ficam DE FORA de propósito. Esta API devolve 502 e
    # 503 por conta própria quando um vendor falha (Clubgas, M7, circuito
    # aberto, IntegrationError) e, com eles na lista, o Nginx:
    #  - repetiria o GET na outra réplica, dobrando a chamada ao vendor que já
    #    está com problema;
    #  - contaria cada resposta dessas como falha da RÉPLICA (max_fails): três
    #    em 10 s tiram do rodízio uma réplica saudável e, com as duas fora, a
    #    API inteira responde 502 "no live upstreams" por causa de um vendor.
    # Só troque pela linha abaixo se a API deixar de usar 502/503 como
    # resposta de negócio:
    # proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    # ══ Rotas ════════════════════════════════════════════════════
    # Ordem de escolha do Nginx: `=` (exata) > prefixo mais longo com `^~` >
    # regex (`~`) > prefixo comum. As de upload usam `^~` para não caírem na
    # regex de PDF.
    #
    # Atenção ao acrescentar diretivas dentro de um location: `limit_req`,
    # `add_header`, `proxy_set_header` e `proxy_hide_header` definidos ali
    # SUBSTITUEM os herdados deste bloco (não somam) — repita os que precisar.

    # ── Métricas: nunca para fora ────────────────────────────────
    # O coletor lê /metrics direto dos containers, pela rede do Docker.
    location ^~ /metrics {
        return 404;
    }

    # ── Swagger ──────────────────────────────────────────────────
    # Em produção a API já não sobe /docs sem SWAGGER_ENABLED=true. Para
    # fechar também na borda (cobre /docs, /docs-json e /docs-yaml):
    # location ^~ /docs {
    #     return 404;
    # }

    # ── Saúde: liberado para o monitor externo ───────────────────
    # /health (formato antigo), /health/live e /health/ready.
    location ^~ /health {
        proxy_pass http://beneficios_api;
    }

    # ── Arquivos públicos de upload ──────────────────────────────
    # Servidos pela API (volume uploads-data). Os nomes têm timestamp e sufixo
    # aleatório, então um cache curto no cliente é seguro; o Cache-Control da
    # API (max-age=0) é trocado pelo `expires`. Rajada maior: uma tela de
    # lista dispara dezenas de imagens de uma vez.
    location ^~ /uploads/ {
        limit_req zone=beneficios_geral burst=200 nodelay;
        proxy_hide_header X-Request-Id;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires 10m;
        proxy_pass http://beneficios_api;
    }

    # ── Autenticação: zona mais estreita ─────────────────────────
    # 5 req/s por IP, rajada de 10. Freio de força bruta na borda; o limite
    # por CPF/e-mail é da aplicação. /api/auth/ inclui /api/auth/me, chamado a
    # cada abertura do app: se o 429 aparecer para usuário legítimo atrás de
    # CGNAT, aumente a rajada ou restrinja a zona a login e reset de senha.
    location ^~ /api/auth/ {
        limit_req zone=beneficios_auth  burst=10 nodelay;
        limit_req zone=beneficios_geral burst=60 nodelay;
        proxy_pass http://beneficios_api;
    }

    location = /api/associado/primeiro-acesso {
        limit_req zone=beneficios_auth  burst=10 nodelay;
        limit_req zone=beneficios_geral burst=60 nodelay;
        proxy_pass http://beneficios_api;
    }

    location ^~ /api/admin-panel/auth/ {
        limit_req zone=beneficios_auth  burst=10 nodelay;
        limit_req zone=beneficios_geral burst=60 nodelay;
        proxy_pass http://beneficios_api;
    }

    # ── Uploads: corpo de até 25 MB ──────────────────────────────
    # Revistoria: fotos em base64 no JSON e multipart do template.
    location ^~ /api/reinspection {
        client_max_body_size 25m;
        proxy_pass http://beneficios_api;
    }

    # Publicação de release OTA (zip do `expo export`). A aplicação aceita até
    # EXPO_UPDATES_UPLOAD_LIMIT_MB (padrão 200) e os docs do projeto
    # (docs/EXPO_UPDATES_OTA.md, docs/GUIA_RELEASE_E_OTA.md) pedem 200m nesta
    # rota: o zip costuma ter de 5 a 30 MB, e com 25m o script de publicação
    # falharia com 413 nos maiores. Fica na zona estreita porque o Nginx grava
    # o corpo inteiro em disco antes de a API conferir o x-admin-token.
    location = /api/expo-updates/admin/publicar {
        client_max_body_size 200m;
        limit_req zone=beneficios_auth burst=5 nodelay;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://beneficios_api;
    }

    # Demais rotas do expo-updates (manifest, assets, admin).
    location ^~ /api/expo-updates {
        client_max_body_size 25m;
        proxy_pass http://beneficios_api;
    }

    # Associado da Sorte (painel): arte da raspadinha, imagem de prêmio e
    # planilha do cronograma em base64.
    location ^~ /api/admin/associado-sorte {
        client_max_body_size 25m;
        proxy_pass http://beneficios_api;
    }

    # Parceiros diretos (painel): logo. A rota real do módulo direct-partners
    # é /api/admin/parceiros-diretos (não existe /api/direct-partners).
    location ^~ /api/admin/parceiros-diretos {
        client_max_body_size 25m;
        proxy_pass http://beneficios_api;
    }

    # Notificações: imagem do pop-up e planilha do disparo por situação.
    location ^~ /api/notifications {
        client_max_body_size 25m;
        proxy_pass http://beneficios_api;
    }

    location ^~ /api/slider {
        client_max_body_size 25m;
        proxy_pass http://beneficios_api;
    }

    location ^~ /api/oficina {
        client_max_body_size 25m;
        proxy_pass http://beneficios_api;
    }

    location ^~ /api/documentos {
        client_max_body_size 25m;
        proxy_pass http://beneficios_api;
    }

    # Foto de perfil (PATCH /api/associado/:id). A barra final é necessária:
    # sem ela o prefixo também casaria com /api/associado-sorte.
    location ^~ /api/associado/ {
        client_max_body_size 25m;
        proxy_pass http://beneficios_api;
    }

    # ── PDFs e relatórios: leitura de até 180 s ──────────────────
    # Toda rota com /pdf ou /relatorio no caminho (hoje, as de
    # /api/rastreamento/...). A API espera o job de PDF por até PDF_PRAZO_MS
    # (padrão 120 s) antes de devolver 504; os 180 s ficam acima disso.
    # Sem buffer de resposta: o PDF de contestação v2 é enviado em streaming
    # para manter a conexão do app ativa, e o buffer seguraria os primeiros
    # bytes até encher.
    location ~ /(pdf|relatorio) {
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        proxy_pass http://beneficios_api;
    }

    # ── Todo o resto (API em /api/...) ───────────────────────────
    location / {
        proxy_pass http://beneficios_api;
    }
}
